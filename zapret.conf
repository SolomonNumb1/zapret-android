# Конфигурация zapret
# Этот файл копируется install.sh в /data/local/tmp/zapret/
# и читается zapret.sh при каждом запуске.

# Стратегия обхода DPI. Имя файла из strategies/ без расширения .conf
# Проверенные стратегии: general (базовая), alt11 (рекомендуемая для РФ),
# alt2, alt3, alt4, alt5, fake-tls-auto и другие. Смотрите README.md
STRATEGY=alt11

# Номер очереди NFQUEUE. Должен совпадать с --qnum= внутри strategies/*.conf
# (все сгенерированные конфиги используют 200)
QUEUE=200

# TCP порты, которые направляются в очередь nfqws
TCP_PORTS=80,443,2053,2083,2087,2096,8443

# UDP порты, которые направляются в очередь nfqws
UDP_PORTS=443,19294-19344,50000-50100
